name: CI

# Baut, prüft und testet bei jedem Push und Pull Request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    name: Build, Vet, Format, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format prüfen (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Nicht formatierte Dateien:"; echo "$fmt_out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Tests
        run: go test ./...

  vuln:
    name: Sicherheits-Check (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck installieren & ausführen
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
